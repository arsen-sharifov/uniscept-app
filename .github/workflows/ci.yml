name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
  INVITE_CODE: ci-invite-placeholder

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint:check

      - name: Format check
        run: pnpm format:check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: pnpm audit
        run: pnpm audit --audit-level=high --prod

      - name: pnpm dedupe check
        run: pnpm dedupe --check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: pnpm test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "### Unit coverage"
              jq -r '"| Metric | % |\n|---|---|\n| Statements | \(.total.statements.pct)% |\n| Branches | \(.total.branches.pct)% |\n| Functions | \(.total.functions.pct)% |\n| Lines | \(.total.lines.pct)% |"' coverage/coverage-summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  e2e:
    name: Integration & E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Start Supabase
        id: supabase
        run: |
          pnpm db:start
          status=$(pnpm exec supabase status -o json)
          url=$(echo "$status" | jq -er '.API_URL')
          anon_key=$(echo "$status" | jq -er '.PUBLISHABLE_KEY // .ANON_KEY')
          service_role_key=$(echo "$status" | jq -er '.SECRET_KEY // .SERVICE_ROLE_KEY')
          {
            echo "url=$url"
            echo "anon_key=$anon_key"
            echo "service_role_key=$service_role_key"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: pnpm build

      - name: Integration tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: pnpm test:integration

      - name: Resolve Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(jq -er '.devDependencies["@playwright/test"] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        run: pnpm test:e2e

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            playwright-report/e2e
            test-results/e2e
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop

  build-storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    outputs:
      playwright-image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve Playwright image
        id: image
        run: |
          version=$(jq -er '.devDependencies["@playwright/test"] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  visual:
    name: Visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-storybook
    container:
      image: ${{ needs.build-storybook.outputs.playwright-image }}
      options: --ipc=host
    env:
      VISUAL_CONTAINER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download Storybook build
        uses: actions/download-artifact@v7
        with:
          name: storybook-static
          path: storybook-static

      - name: Visual tests
        run: pnpm exec playwright test --config=playwright.visual.config.ts

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            playwright-report/visual
            test-results/visual
          retention-days: 14
