name: Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      deployment: false
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Back up database
        uses: ./.github/actions/backup
        with:
          name: backup-nightly-${{ github.run_attempt }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          database-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          passphrase: ${{ secrets.BACKUP_PASSPHRASE }}
