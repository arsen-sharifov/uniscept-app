name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check and build everything without changing the database, auth settings or the live site
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@60.1.3

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
      deployment: ${{ !inputs.dry-run }}
    permissions:
      actions: read
      contents: write
      statuses: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SITE_URL: ${{ vars.SITE_URL }}
      SMTP_ADMIN_EMAIL: ${{ vars.SMTP_ADMIN_EMAIL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
            --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI has not passed on $GITHUB_SHA (conclusion: ${conclusion:-none})"
            exit 1
          fi

      - name: Check settings
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          for name in SITE_URL SMTP_ADMIN_EMAIL SMTP_HOST SMTP_USER SUPABASE_PROJECT_ID VERCEL_ORG_ID VERCEL_PROJECT_ID \
            BACKUP_PASSPHRASE SMTP_PASS SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::The production environment is missing:$missing"
            exit 1
          fi
          if ! grep -qx "project_id = \"$SUPABASE_PROJECT_ID\"" supabase/config.toml; then
            echo "::error file=supabase/config.toml::No [remotes.*] block targets $SUPABASE_PROJECT_ID"
            exit 1
          fi

      - name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -er '.version' package.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [ "$(git rev-list -n1 "$tag")" != "$GITHUB_SHA" ]; then
            echo "::error file=package.json::$tag already belongs to another commit"
            exit 1
          fi
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          {
            echo "RELEASE_TAG=$tag"
            echo "PREVIOUS_RELEASE=$previous"
          } >> "$GITHUB_ENV"

      - name: Mark as releasing
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --silent
          -f state=pending -f context=Release -f description="Releasing $RELEASE_TAG" -f target_url="$RUN_URL"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          missing=""
          for name in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            grep -qE "^$name=\"?[^\"]" .vercel/.env.production.local || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::The Vercel production environment is missing:$missing"
            exit 1
          fi
          app_url=$(sed -nE 's/^NEXT_PUBLIC_APP_URL="?([^"]*)"?$/\1/p' .vercel/.env.production.local)
          if [ "${app_url%/}" != "${SITE_URL%/}" ]; then
            echo "::error::NEXT_PUBLIC_APP_URL on Vercel ($app_url) does not match SITE_URL ($SITE_URL)"
            exit 1
          fi
          supabase_url=$(sed -nE 's/^NEXT_PUBLIC_SUPABASE_URL="?([^"]*)"?$/\1/p' .vercel/.env.production.local)
          if [ "${supabase_url%/}" != "https://$SUPABASE_PROJECT_ID.supabase.co" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL on Vercel ($supabase_url) does not point to $SUPABASE_PROJECT_ID"
            exit 1
          fi
          pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview auth config
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase config diff --project-ref "$SUPABASE_PROJECT_ID"

      - name: Back up database
        uses: ./.github/actions/backup
        with:
          name: backup-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          database-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          passphrase: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: Show pending migrations
        if: ${{ inputs.dry-run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --dry-run

      - name: Apply migrations
        if: ${{ !inputs.dry-run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --yes

      - name: Tag release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Apply auth config
        if: ${{ !inputs.dry-run }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"

      - name: Check deployment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          for path in / /login; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$DEPLOYMENT_URL$path"
          done

      - name: Go live
        if: ${{ !inputs.dry-run }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "$VERCEL_CLI" promote "$DEPLOYMENT_URL" --yes --timeout=5m --token="$VERCEL_TOKEN"

      - name: Check production
        if: ${{ !inputs.dry-run }}
        run: |
          for path in / /login; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null "${SITE_URL%/}$path"
          done

      - name: Publish release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Mark as released
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PREVIOUS_RELEASE" ]; then
            range="$PREVIOUS_RELEASE..$GITHUB_SHA"
          else
            range="$(git log --diff-filter=A --format=%H -- .github/workflows/release.yml | tail -n1)^..$GITHUB_SHA"
          fi
          git rev-list --first-parent "$range" | xargs -r -I {} gh api "repos/$GITHUB_REPOSITORY/statuses/{}" --silent \
            -f state=success -f context=Release -f description="Released $RELEASE_TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

      - name: Mark as failed
        if: ${{ !inputs.dry-run && (failure() || cancelled()) && env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          description="Release $RELEASE_TAG failed"
          if [ "$JOB_STATUS" = cancelled ]; then
            description="Release $RELEASE_TAG was cancelled"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --silent \
            -f state=failure -f context=Release -f description="$description" -f target_url="$RUN_URL"
